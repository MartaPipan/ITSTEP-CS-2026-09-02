<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Періодична таблиця</title>

    <style>
        table {}

    </style>
</head>

<body>

<table class="periodic">

<!-- ПЕРІОД 1 -->
<tr>
    <td>
        <table>
            <tr>
                <td>1</td>
                <td rowspan="4">1</td>
            </tr>
            <tr>
                <td>H</td>
            </tr>
            <tr>
                <td>Водень</td>
            </tr>
            <tr>
                <td>1.00794</td>
            </tr>
        </table>
    </td>

    <!-- 16 порожніх клітинок -->
    <td colspan="16" ></td>

    <td>
        <table>
            <tr>
                <td>2</td>
                <td rowspan="4">2</td>
            </tr>
            <tr>
                <td>He</td>
            </tr>
            <tr>
                <td>Гелій</td>
            </tr>
            <tr>
                <td>4.0026</td>
            </tr>
        </table>
    </td>

</tr>
</table>

</body>
</html>
